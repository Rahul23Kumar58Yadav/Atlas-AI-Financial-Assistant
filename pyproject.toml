[project]
name = "atlas-financial-assistant"
version = "0.1.0"
description = "AI-powered financial assistant for Telegram"
requires-python = ">=3.11"
readme = "README.md"

# requirements.txt remains the source of truth for `pip install -r requirements.txt`;
# this list exists so `pip install -e .` also works for local development.
dependencies = [
    "aiogram>=3.13.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "anthropic>=0.34.2",
    "openai>=1.51.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "apscheduler>=3.10.4",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "google-api-python-client>=2.149.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "pypdf>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "reportlab>=4.2.5",
    "ruff>=0.7.0",
    "black>=24.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # line length handled by formatter, not linter

[tool.black]
line-length = 120
target-version = ["py312"]
